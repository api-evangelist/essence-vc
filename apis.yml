aid: essence-vc
name: Essence VC
x-type: venture-capital
x-category: Micro VC
description: 'Essence VC is an early-stage venture firm founded by solo GP Timothy
  Chen (former SVP Engineering at Cosmos, cofounder of Hyperpilot, early at Mesosphere
  and CloudFoundry, Apache member) that invests exclusively in infrastructure companies,
  from inception and pre-seed onward. Started seven years before its 2025 Fund IV
  with a $1 million first fund; Fund III was $27 million anchored by Cendana Capital.
  The thesis has broadened from developer tools to horizontal and vertical infrastructure:
  AI, data, developer, security, fintech and creative infra. Portfolio includes Modal,
  Ollama, Warp, Tabular, ComfyUI, Cline, LanceDB, MotherDuck and Restate. Fund IV
  was deliberately kept modest in size to preserve hands-on early-stage work. Hosts
  the Open Source Startup Podcast and The Infra Pod.'
